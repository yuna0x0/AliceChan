name: Basis editor image

# Builds one Unity editor image that carries every build target the Basis bundle combines
# (windows-mono, linux-il2cpp, android) and pushes it to this account's container registry.
# GameCI's pre-built images ship one module each, and Basis builds all targets in one process.
# Run it once per Unity version; basis.yml pulls the result.

on:
  workflow_dispatch:
    inputs:
      unityVersion:
        description: Unity editor version
        default: 6000.5.10f1
      modules:
        description: Comma separated Unity modules
        default: windows-mono,linux-il2cpp,android

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install the GameCI CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/game-ci/cli/main/install.sh | sh
          echo "$HOME/.game-ci/bin" >> "$GITHUB_PATH"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          game-ci build-unity-image ubuntu "${{ github.event.inputs.modules }}" \
            --unity-version "${{ github.event.inputs.unityVersion }}" \
            --tag "ghcr.io/${{ github.repository_owner }}/unity-editor:${{ github.event.inputs.unityVersion }}-basis" \
            --push
